# i3bar block, generated by wallust from the wallpaper.
# Do NOT edit this file directly: edit the template at
#   ~/.config/wallust/templates/i3bar.conf
# and run `wallust run <image>` (the wallpaper picker does this for you).
#
# The whole block is generated (not just the colors) because i3's `include`
# cannot sit inside a bar {} block and i3 does not expand $variables there,
# so the colors have to be written out as literal hex values.
bar {
    status_command i3status-rs ~/.config/i3status-rust/config.toml
    position top
    font pango:JetBrainsMono Nerd Font 10
    tray_output primary
    separator_symbol " "
    workspace_min_width 24

    colors {
        background {{background}}
        statusline {{foreground}}
        separator  {{color8}}

        # class              border         background     text
        focused_workspace    {{color4}}     {{color4}}     {{background}}
        active_workspace     {{color8}}     {{color8}}     {{foreground}}
        inactive_workspace   {{background}} {{background}} {{color7}}
        urgent_workspace     {{color1}}     {{color1}}     {{background}}
        binding_mode         {{color1}}     {{color1}}     {{background}}
    }
}
