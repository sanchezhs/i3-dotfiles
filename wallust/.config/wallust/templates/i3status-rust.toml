# i3status-rust config, generated by wallust from the wallpaper.
# Do NOT edit this file directly: edit the template at
#   ~/.config/wallust/templates/i3status-rust.toml
# and run `wallust run <image>` (the wallpaper picker does this for you).
#
# The theme colors come from the palette; the blocks below are the layout.

[theme]
theme = "slick"

[theme.overrides]
idle_bg      = "{{background}}"
idle_fg      = "{{foreground}}"
info_bg      = "{{color4}}"
info_fg      = "{{background}}"
good_bg      = "{{color2}}"
good_fg      = "{{background}}"
warning_bg   = "{{color3}}"
warning_fg   = "{{background}}"
critical_bg  = "{{color1}}"
critical_fg  = "{{background}}"
separator    = ""

[icons]
icons = "material-nf"

# ── Network (Wi-Fi / wired) ───────────────────────────────────────────
[[block]]
block = "net"
format = " $icon {$signal_strength $ssid|$ip} "
interval = 5

# ── Backlight ─────────────────────────────────────────────────────────
[[block]]
block = "backlight"
format = " $icon $brightness "

# ── Volume ────────────────────────────────────────────────────────────
[[block]]
block = "sound"
format = " $icon {$volume|muted} "
click = [{ button = "left", cmd = "pavucontrol" }]

# ── Battery ───────────────────────────────────────────────────────────
[[block]]
block = "battery"
device = "BAT1"
format = " $icon $percentage "
full_format = " $icon full "
charging_format = " $icon $percentage "

# ── Clock ─────────────────────────────────────────────────────────────
[[block]]
block = "time"
format = " $icon $timestamp.datetime(f:'%a %d %b  %H:%M') "
interval = 5
